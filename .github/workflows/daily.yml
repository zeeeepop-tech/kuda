# kuda. — collects Banja Luka culture events every morning and publishes the site.
name: Daily update

on:
  schedule:
    - cron: "17 4 * * *"   # every day at 04:17 UTC = 05:17 in Banja Luka (06:17 in summer)
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab
  push:
    branches: [main]        # also publish right after you change a file

permissions:
  contents: write   # saves the day's events in the repository
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore saved pictures
        uses: actions/cache@v4
        with:
          path: .cache
          key: kuda-cache-${{ github.run_id }}
          restore-keys: kuda-cache-

      - name: Collect events
        run: python collect.py

      - name: Save the events in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/events.js
          git diff --cached --quiet || git commit -m "Events for $(date -u +%Y-%m-%d)"
          git push || (git pull --rebase && git push)

      - name: Build the site (event pages, pictures, share image)
        run: |
          python -m pip install --quiet pillow
          python build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
